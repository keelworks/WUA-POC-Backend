version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wua_poc_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/prisma/data/dev.db
    volumes:
      - sqlite_data:/app/prisma/data

volumes:
  sqlite_data:
    driver: local
